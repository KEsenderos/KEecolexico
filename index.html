<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KEecolexico">
<title>KEecolexico</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<!-- index.html — KEecolexico の全画面（表示する画面を切り替えて使う） -->
<!-- 基づく仕様書：KEecolexico 仕様書 v1.3 -->
</head>
<body>
<main class="app">

  <!-- ===== ロゴ（どの画面でも上部に固定。仕様 8.1.1） ===== -->
  <header id="app-header" class="app-header">
    <div class="app-brand">
      <img id="img-app-logo" class="app-logo" src="icons/icon-192.png" alt="" width="30" height="30">
      <div class="app-wordmark" aria-label="KEecolexico"><span class="wm-ke">KE</span><span class="wm-eco">eco</span><span class="wm-lex">lexico</span></div>
    </div>
  </header>

  <!-- ===== 更新のお知らせ（新しい版を取り込んだときだけ。仕様 8.11） ===== -->
  <button id="banner-update" class="update-banner" type="button" hidden>
    <span id="txt-update-main" class="update-main"></span>
    <span id="txt-update-note" class="update-note"></span>
  </button>

  <!-- ===== 記事一覧 ===== -->
  <section id="screen-library" class="screen">
    <button id="btn-add-drive" class="btn btn-primary btn-big" type="button">＋ ドライブから追加</button>
    <button id="btn-add-article" class="btn btn-small" type="button">iPhoneのファイルから追加</button>
    <div id="msg-library" class="msg" role="status"></div>
    <div id="list-articles" class="list"></div>
    <div id="txt-library-empty" class="empty">（記事がありません）</div>
    <div id="txt-version" class="version"></div>
  </section>

  <!-- ===== ドライブから追加 ===== -->
  <section id="screen-drive" class="screen" hidden>
    <header class="subbar">
      <button id="btn-drive-back" class="btn btn-back" type="button">◀ 戻る</button>
      <div id="txt-drive-title" class="subtitle">ドライブから追加</div>
    </header>
    <button id="btn-drive-reload" class="btn" type="button">一覧を読み直す</button>
    <div id="msg-drive" class="msg" role="status"></div>
    <button id="btn-drive-pick-audio" class="btn btn-primary" type="button" hidden>音声だけiPhoneから選ぶ</button>
    <input id="input-drive-audio" type="file" hidden>
    <div id="list-drive" class="list"></div>
  </section>

  <!-- ===== iPhoneのファイルから追加（予備） ===== -->
  <section id="screen-import" class="screen" hidden>
    <header class="subbar">
      <button id="btn-import-back" class="btn btn-back" type="button">◀ 戻る</button>
      <div class="subtitle">iPhoneのファイルから追加</div>
    </header>
    <div class="card">
      <div class="step">① 記事の本文を貼る</div>
      <textarea id="input-article" class="textarea" rows="6" placeholder="記事の本文を貼り付け"></textarea>
      <button id="btn-pick-txt" class="btn btn-small" type="button">.txtを選ぶ</button>
      <input id="input-txt" type="file" hidden>
      <div id="txt-parse-summary" class="summary"></div>
    </div>
    <div class="card">
      <div class="step-row"><span class="step">② CSVを選ぶ</span><button id="btn-pick-csv" class="btn btn-small" type="button">CSVを選ぶ</button></div>
      <input id="input-csv" type="file" hidden>
      <div id="txt-csv-summary" class="summary"></div>
    </div>
    <div class="card">
      <div class="step-row"><span class="step">③ 音声を選ぶ</span><button id="btn-pick-audio" class="btn btn-small" type="button">音声を選ぶ</button></div>
      <input id="input-audio" type="file" hidden>
      <div id="txt-audio-summary" class="summary"></div>
    </div>
    <div class="card">
      <div class="step">④ 記事名</div>
      <input id="input-title" class="input" type="text">
    </div>
    <button id="btn-import-save" class="btn btn-primary btn-big" type="button">保存して、節の位置の記録へ</button>
    <div id="msg-import" class="msg" role="status"></div>
  </section>

  <!-- ===== 節の位置の記録 ===== -->
  <section id="screen-mark" class="screen" hidden>
    <header class="subbar">
      <div class="subtitle subtitle-large">区切り</div>
    </header>
    <div id="txt-marks-summary" class="progress"></div>
    <div id="list-marks" class="mark-list"></div>
    <button id="btn-mark-reset" class="btn" type="button" hidden>最初から記録し直す</button>
    <div id="msg-mark" class="msg" role="status"></div>
  </section>

  <!-- ===== 作業場（タブ「作業場」。仕様 8.5） ===== -->
  <section id="screen-study" class="screen" hidden>
    <div id="study-top" class="study-top">
      <div class="study-head">
        <div id="txt-study-title" class="study-title"></div>
      </div>
      <button id="txt-sync-status" class="sync-status" type="button" hidden></button>
      <div id="txt-progress" class="progress"></div>
      <!-- 作業場の小さなタブ（仕様 8.5.1） -->
      <div class="work-tabs">
        <button id="btn-work-article" class="work-tab" type="button" aria-pressed="true">本文分割</button>
        <button id="btn-work-section" class="work-tab" type="button" aria-pressed="false">節分割</button>
      </div>
      <!-- 本文分割（仕様 8.5.2） -->
      <div id="panel-work-article" class="work-panel">
        <div class="split-sel-row">
          <label class="split-sel-label" for="sel-split-block">この節</label>
          <select id="sel-split-block" class="split-sel"></select>
        </div>
        <div id="panel-article-text" class="text-panel"></div>
        <div id="txt-hint-article" class="memo-hint"></div>
      </div>
      <!-- 節分割（仕様 8.5.3） -->
      <div id="panel-work-section" class="work-panel" hidden>
        <div class="sec-nav">
          <button id="btn-sec-prev" class="btn btn-nav" type="button">◀前</button>
          <button id="btn-sec-label" class="btn btn-sec-label" type="button"></button>
          <button id="btn-sec-next" class="btn btn-nav" type="button">次▶</button>
        </div>
        <div id="panel-section-text" class="text-panel"></div>
        <div id="txt-hint-section" class="memo-hint"></div>
      </div>
      <div class="range-row">
        <button id="btn-mark-start" class="mark-btn mark-start" type="button"><span>ここを</span><span>開始</span></button>
        <div id="txt-range" class="range-edit" aria-label="繰り返す範囲">--:--〜--:--</div>
        <button id="btn-mark-end-range" class="mark-btn mark-end" type="button"><span>ここを</span><span>終了</span></button>
      </div>
      <div id="bar-range" class="bar"><div id="bar-range-fill" class="bar-fill"></div></div>
      <div id="panel-range" class="range-panel">
        <div class="dg-row" id="row-start">
          <span class="dg-label">開始</span>
          <div class="dg-col">
            <button id="btn-start-m10-up" class="digit-btn" type="button" data-target="start" data-unit="600" data-dir="1" aria-label="開始 +600秒">▲</button>
            <span id="txt-start-m10" class="dg-num">0</span>
            <button id="btn-start-m10-down" class="digit-btn" type="button" data-target="start" data-unit="600" data-dir="-1" aria-label="開始 −600秒">▼</button>
          </div>
          <div class="dg-col">
            <button id="btn-start-m1-up" class="digit-btn" type="button" data-target="start" data-unit="60" data-dir="1" aria-label="開始 +60秒">▲</button>
            <span id="txt-start-m1" class="dg-num">0</span>
            <button id="btn-start-m1-down" class="digit-btn" type="button" data-target="start" data-unit="60" data-dir="-1" aria-label="開始 −60秒">▼</button>
          </div>
          <span class="dg-colon">:</span>
          <div class="dg-col">
            <button id="btn-start-s10-up" class="digit-btn" type="button" data-target="start" data-unit="10" data-dir="1" aria-label="開始 +10秒">▲</button>
            <span id="txt-start-s10" class="dg-num">0</span>
            <button id="btn-start-s10-down" class="digit-btn" type="button" data-target="start" data-unit="10" data-dir="-1" aria-label="開始 −10秒">▼</button>
          </div>
          <div class="dg-col">
            <button id="btn-start-s1-up" class="digit-btn" type="button" data-target="start" data-unit="1" data-dir="1" aria-label="開始 +1秒">▲</button>
            <span id="txt-start-s1" class="dg-num">0</span>
            <button id="btn-start-s1-down" class="digit-btn" type="button" data-target="start" data-unit="1" data-dir="-1" aria-label="開始 −1秒">▼</button>
          </div>
        </div>
        <div class="dg-row" id="row-end">
          <span class="dg-label">終了</span>
          <div class="dg-col">
            <button id="btn-end-m10-up" class="digit-btn" type="button" data-target="end" data-unit="600" data-dir="1" aria-label="終了 +600秒">▲</button>
            <span id="txt-end-m10" class="dg-num">0</span>
            <button id="btn-end-m10-down" class="digit-btn" type="button" data-target="end" data-unit="600" data-dir="-1" aria-label="終了 −600秒">▼</button>
          </div>
          <div class="dg-col">
            <button id="btn-end-m1-up" class="digit-btn" type="button" data-target="end" data-unit="60" data-dir="1" aria-label="終了 +60秒">▲</button>
            <span id="txt-end-m1" class="dg-num">0</span>
            <button id="btn-end-m1-down" class="digit-btn" type="button" data-target="end" data-unit="60" data-dir="-1" aria-label="終了 −60秒">▼</button>
          </div>
          <span class="dg-colon">:</span>
          <div class="dg-col">
            <button id="btn-end-s10-up" class="digit-btn" type="button" data-target="end" data-unit="10" data-dir="1" aria-label="終了 +10秒">▲</button>
            <span id="txt-end-s10" class="dg-num">0</span>
            <button id="btn-end-s10-down" class="digit-btn" type="button" data-target="end" data-unit="10" data-dir="-1" aria-label="終了 −10秒">▼</button>
          </div>
          <div class="dg-col">
            <button id="btn-end-s1-up" class="digit-btn" type="button" data-target="end" data-unit="1" data-dir="1" aria-label="終了 +1秒">▲</button>
            <span id="txt-end-s1" class="dg-num">0</span>
            <button id="btn-end-s1-down" class="digit-btn" type="button" data-target="end" data-unit="1" data-dir="-1" aria-label="終了 −1秒">▼</button>
          </div>
        </div>
      </div>
      <div class="controls-2">
        <button id="btn-stop" class="btn btn-ctl2" type="button">■ 停止</button>
        <button id="btn-all" class="btn btn-ctl2" type="button">全範囲</button>
      </div>
      <div class="save-row">
        <button id="btn-section-save" class="btn btn-section-save" type="button">節保存</button>
        <button id="btn-section-add" class="btn btn-section-add" type="button">区間を足す</button>
        <button id="btn-memo-save" class="btn btn-memo-save" type="button" hidden>文保存</button>
      </div>
      <div id="msg-study" class="msg msg-tight" role="status"></div>
    </div>
  </section>

  <!-- ===== 学習（タブ「学習」。仕様 8.10） ===== -->
  <section id="screen-words" class="screen" hidden>
    <div class="words-head">
      <div class="words-nav">
        <button id="btn-words-prev" class="icon-btn words-arrow" type="button" aria-label="前の区間">‹</button>
        <div id="txt-words-title" class="words-title"></div>
        <button id="btn-words-next" class="icon-btn words-arrow" type="button" aria-label="次の区間">›</button>
      </div>
      <div id="txt-words-progress" class="progress"></div>
    </div>
    <div id="list-words" class="words"></div>
    <button id="btn-complete" class="btn btn-complete" type="button">この節を完了</button>
  </section>

  <!-- ===== 設定 ===== -->
  <section id="screen-settings" class="screen" hidden>
    <header class="subbar">
      <div class="subtitle subtitle-large">設定</div>
    </header>
    <div class="card">
      <div class="step">文字サイズ</div>
      <div class="row-3">
        <button id="btn-font-L" class="opt-btn" type="button">大</button>
        <button id="btn-font-M" class="opt-btn" type="button">中</button>
        <button id="btn-font-S" class="opt-btn" type="button">小</button>
      </div>
    </div>
    <div class="card">
      <div class="step">締切の曜日</div>
      <div class="row-2">
        <button id="btn-deadline-5" class="opt-btn" type="button">金曜</button>
        <button id="btn-deadline-6" class="opt-btn" type="button">土曜</button>
      </div>
    </div>
    <div class="card">
      <div class="step">くり返しの間（無音）</div>
      <div class="row-gap">
        <button id="btn-gap-0" class="opt-btn gap-btn" type="button" data-gap="0">なし</button>
        <button id="btn-gap-1" class="opt-btn gap-btn" type="button" data-gap="1">1秒</button>
        <button id="btn-gap-2" class="opt-btn gap-btn" type="button" data-gap="2">2秒</button>
        <button id="btn-gap-3" class="opt-btn gap-btn" type="button" data-gap="3">3秒</button>
        <button id="btn-gap-5" class="opt-btn gap-btn" type="button" data-gap="5">5秒</button>
      </div>
    </div>
    <div class="card">
      <div class="step">Googleドライブ</div>
      <label class="field-label" for="input-gas-url">GASのウェブアプリのURL</label>
      <input id="input-gas-url" class="input" type="url" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label class="field-label" for="input-gas-key">合言葉</label>
      <input id="input-gas-key" class="input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="btn-gas-save" class="btn btn-primary" type="button">保存</button>
    </div>
    <div class="card">
      <div class="step">区切り・完了の控え（ファイル）</div>
      <div class="field-label">ドライブを通さずに、区切り・完了をファイルで保存・受け渡しします</div>
      <button id="btn-backup-export" class="btn" type="button">ファイルに書き出す（すべての記事）</button>
      <button id="btn-backup-import" class="btn" type="button">ファイルから読み込む</button>
      <input id="input-backup" type="file" accept=".json,application/json" hidden>
    </div>
    <div id="msg-settings" class="msg" role="status"></div>
  </section>

</main>

<!-- ===== 節の一覧（学習画面から開く） ===== -->
<div id="sheet-sections" class="sheet" hidden>
  <div class="sheet-box">
    <div class="sheet-head"><span>節を選ぶ</span><button id="btn-sheet-close" class="icon-btn" type="button" aria-label="閉じる">✕</button></div>
    <div id="list-sections" class="sheet-list"></div>
  </div>
</div>

<!-- ===== 固定の再生バー（学習・作業場。仕様 8.10） ===== -->
<div id="mini-player" class="mini-player" hidden>
  <div id="msg-words" class="msg msg-mini" role="status"></div>
  <div class="mini-row">
    <button id="btn-mini-sec" class="mini-sec" type="button" aria-label="節を選ぶ"><span id="txt-mini-label" class="mini-label"></span><span id="txt-mini-range" class="mini-range"></span></button>
    <button id="btn-mini-prev-break" class="mini-btn" type="button" aria-label="前の区切りへ">◀◀<small>前の区切り</small></button>
    <button id="btn-mini-play" class="mini-play" type="button" aria-label="再生">▶</button>
    <button id="btn-mini-next-break" class="mini-move" type="button" aria-label="次の区切りへ">次の区切り<small>▶▶</small></button>
  </div>
  <div class="mini-seek-row">
    <span id="txt-mini-pos" class="mini-pos">--:--</span>
    <input id="seek-mini" class="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="範囲の中の再生位置">
    <div class="rate-wrap">
      <button id="btn-mini-rate" class="mini-rate" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="倍速を選ぶ"><span id="txt-mini-rate">1.0×</span><small>▴</small></button>
      <div id="menu-rate" class="rate-menu" role="menu" hidden></div>
    </div>
  </div>
</div>

<!-- ===== 下のタブ（仕様 8.9） ===== -->
<nav id="tab-bar" class="tab-bar" aria-label="画面の切り替え">
  <button id="tab-library" class="tab" type="button" data-tab="library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M13 4h5.5c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5H13z"/></svg><span>記事</span>
  </button>
  <button id="tab-play" class="tab" type="button" data-tab="play">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2.8"/><circle cx="17.5" cy="17.5" r="2.8"/><path d="M8.6 15.6L18 4M15.4 15.6L6 4"/></svg><span>作業場</span>
  </button>
  <button id="tab-words" class="tab" type="button" data-tab="words">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 10.5h14M5 15h9M5 19.5h6"/></svg><span>学習</span>
  </button>
  <button id="tab-mark" class="tab" type="button" data-tab="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3M17 12h3M10 12h4"/><path d="M8.5 6v12M15.5 6v12"/></svg><span>区切り</span>
  </button>
  <button id="tab-settings" class="tab" type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>設定</span>
  </button>
</nav>

<!-- ===== 受け渡しの確認（仕様 8.8） ===== -->
<div id="sheet-sync" class="sheet sheet-center" hidden>
  <div class="sheet-box sync-box">
    <div id="txt-sync-title" class="sync-title"></div>
    <div id="txt-sync-remote" class="sync-line"></div>
    <div id="txt-sync-local" class="sync-line"></div>
    <button id="btn-sync-use-remote" class="btn btn-primary" type="button"></button>
    <button id="btn-sync-keep-local" class="btn" type="button"></button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/stretch.js"></script>
<script src="js/engine.js"></script>
<script src="js/mediaSession.js"></script>
<script src="js/article.js"></script>
<script src="js/align-core.js"></script>
<script src="js/autosplit.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/db.js"></script>
<script src="js/drive.js"></script>
<script src="js/sync.js"></script>
<script src="js/progress.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
